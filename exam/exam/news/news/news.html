<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>local product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</head>

<style>
    #stor div img {
        width: 100%;
    }

    #stor div {
        height: 250px;
        width: 250px;
        padding: 40px;
    }

    #stor {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
    }
</style>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Navbar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                   
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="./login.html">logout</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="./addnew.html">addnew</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="./news.html">news</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="./singup.html">sing up</a>
                    </li>
                  
            </div>
        </div>
    </nav>
    <form class="d-flex" id="search">
        <input class="from-control me-2" type="search" id="search-value" placeholder="search" aria-label="search" />
        <button class="btn btn-outline-success" type="submit">submit</button>
    </form>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 p-2">


                <div class="btn btn-info" id="india">india</div>

                <div class="btn btn-info" id="usa">usa</div>

                <div class="btn btn-info" id="london">london</div>
            </div>
        </div>
    </div>
    <div id="stor">

    </div>
</body>
<script>

    let newsd = JSON.parse(localStorage.getItem('data')) || []

    const uimaker = (newsd) => {
        document.getElementById("stor").innerHTML = ""
        newsd.map((ele) => {
            let tittle = document.createElement("h1")
            tittle.innerHTML = ele.tittle
            let img = document.createElement("img")
            img.src = ele.img
            let comment = document.createElement("p")
            comment.innerHTML = ele.comment
            let selectcontry = document.createElement("h4")
            selectcontry.innerHTML = ele.selectcontry
            let div = document.createElement("div")

            div.append(img, tittle, comment,selectcontry)

            document.getElementById("stor").append(div)
        })
        
    }
 
    uimaker(newsd)

    const filter = (val) => {
        let temp = newsd.filter((ele) => ele.selectcontry == val)
        uimaker(temp)
    }
    const search = (val) => {
        let temp = newsd.filter((ele) => ele.tittle.includes(val))
        uimaker(temp)
    }
    const handlesearch = (e) => {
        e.preventDefault()

        let tittle = document.getElementById("search-value").value
        search(tittle)
    }
    document.getElementById("usa").addEventListener("click", () => filter("usa"))
    document.getElementById("london").addEventListener("click", () => filter("london"))
    document.getElementById("india").addEventListener("click", () => filter("india"))
    document.getElementById("search").addEventListener("submit", handlesearch)
</script>

</html>
